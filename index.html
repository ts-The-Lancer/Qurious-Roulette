<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>傀異ルーレット Ver. 1.18.1</title>
    <style>
        :root { --accent-color: #ff4757; --bg-dark: #1a1a1a; --panel-bg: #2d2d2d; }
        body {
            font-family: sans-serif; display: flex; justify-content: center;
            background-color: var(--bg-dark); color: #e0e0e0; margin: 0; padding: 15px;
            min-height: 100vh; box-sizing: border-box;
        }
        .container {
            background: var(--panel-bg); padding: 20px; border-radius: 15px;
            width: 100%; max-width: 900px; text-align: center;
            border: 1px solid #444; display: flex; flex-direction: column; gap: 15px;
        }
        .header-area { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        /* タブシステム */
        .tab-container { display: flex; gap: 5px; border-bottom: 2px solid #444; padding-bottom: 0; }
        .tab-btn { background: #333; border: 1px solid #444; border-bottom: none; color: #aaa; padding: 10px 20px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: 0.2s; }
        .tab-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ルーレット用レイアウト */
        .main-content { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 768px) { .main-content { flex-direction: row; } .left-panel { flex: 1.2; } .right-panel { flex: 0.8; } }
        
        #settings-panel { display: none; text-align: left; background: #333; padding: 15px; border-radius: 10px; border: 1px solid #555; margin-bottom: 15px; }
        
        /* バックアップ＆プリセットエリア */
        .preset-container { background: #222; border: 1px solid #555; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .preset-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #2d2d2d; padding: 6px 10px; border-radius: 5px; margin-bottom: 5px; border: 1px solid #444; }
        .preset-name { font-size: 0.85rem; color: #fff; font-weight: bold; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .preset-empty { font-size: 0.8rem; color: #777; font-style: italic; }
        .preset-action-btn { font-size: 0.7rem; padding: 4px 8px; border: none; border-radius: 3px; cursor: pointer; color: white; transition: 0.2s; }

        .search-container { background: #252525; padding: 12px; border-radius: 8px; border: 1px solid #444; margin-bottom: 10px; }
        .search-label { font-size: 0.7rem; color: #888; margin-bottom: 5px; font-weight: bold; }
        
        .index-grid { display: grid; gap: 4px; margin-bottom: 10px; }
        .ex-grid { grid-template-columns: repeat(9, 1fr); }
        .kana-grid { grid-template-columns: repeat(5, 1fr); }
        
        .index-btn { background: #444; border: 1px solid #555; color: #ccc; font-size: 0.75rem; padding: 6px 0; border-radius: 4px; cursor: pointer; }
        .index-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        
        .bulk-actions { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
        .bulk-btn { border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; color: white; }

        .item-scroll { max-height: 380px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 6px; border: 1px solid #444; margin-bottom: 10px; }
        
        /* 編集用行アイテム */
        .edit-row { 
            padding: 8px; border-bottom: 1px solid #2a2a2a; transition: background-color 0.2s; 
            background: #222; border-radius: 6px; margin-bottom: 6px; border: 1px solid #333;
        }
        .edit-row.dragging { opacity: 0.4; background: #444; }
        .edit-row.disabled { opacity: 0.5; }
        
        .drag-handle { cursor: grab; color: #888; font-size: 1.1rem; padding: 0 4px; user-select: none; touch-action: none; }
        .drag-handle:active { cursor: grabbing; color: var(--accent-color); }
        
        .move-btn { background: #333; border: 1px solid #555; color: #ccc; font-size: 0.65rem; padding: 2px 5px; border-radius: 3px; cursor: pointer; }
        .move-btn:hover { background: #555; color: #fff; }
        .move-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .input-text { background: transparent; border: none; border-bottom: 1px solid #444; color: #fff; padding: 4px; flex-grow: 1; font-size: 0.9rem; }
        .elem-btn { background: #333; border: 1px solid #555; color: #888; font-size: 0.65rem; padding: 2px 5px; border-radius: 3px; cursor: pointer; }
        .elem-btn.active { background: var(--accent-color); color: white; }
        .delete-btn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 0.9rem; padding: 0 5px; transition: 0.2s; }
        .delete-btn:hover { transform: scale(1.2); }

        .main-btn { background-color: var(--accent-color); border: none; height: 60px; border-radius: 10px; cursor: pointer; width: 100%; color: white; font-size: 1.1rem; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 0 #b3323d; }
        .main-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b3323d; }
        
        /* 討伐ボタン */
        .kill-btn { background-color: #2ecc71; border: none; height: 50px; border-radius: 10px; cursor: pointer; width: 100%; color: white; font-size: 1rem; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 0 #27ae60; transition: 0.1s; }
        .kill-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #27ae60; }
        .kill-btn:disabled { background-color: #555; box-shadow: none; cursor: not-allowed; opacity: 0.6; }

        .stats-info { font-size: 0.8rem; color: #aaa; margin: 10px 0; line-height: 1.6; }
        .stats-highlight { color: var(--accent-color); font-weight: bold; }
        .last-res-area { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #444; font-size: 0.85rem; color: #888; }

        /* メモ帳タブ用スタイル */
        .notepad-area { text-align: left; display: flex; flex-direction: column; gap: 10px; }
        .notepad-toolbar { display: flex; gap: 8px; background: #252525; padding: 8px 12px; border-radius: 6px; border: 1px solid #444; }
        .tool-btn { background: #444; border: 1px solid #555; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .tool-btn:hover { background: #555; border-color: var(--accent-color); }
        .notepad-textarea { width: 100%; height: 450px; background: #1a1a1a; color: #e0e0e0; border: 1px solid #444; border-radius: 10px; padding: 15px; box-sizing: border-box; font-family: monospace; font-size: 0.95rem; line-height: 1.5; resize: vertical; outline: none; }
        .notepad-textarea:focus { border-color: var(--accent-color); }
        .notepad-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #888; }
        
        /* 討伐数＆目標数入力用 */
        .number-input { width: 50px; background: #1a1a1a; border: 1px solid #555; color: #fff; text-align: right; padding: 3px 5px; border-radius: 4px; font-size: 0.8rem; }
        .target-edit-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: #222; border-radius: 5px; margin-bottom: 5px; font-size: 0.85rem; }
        
        /* プログレスバー */
        .progress-bar-bg { width: 100%; background: #444; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
        .progress-bar-fill { height: 100%; background: #2ecc71; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <div style="width:25px"></div>
        <h1>傀異ルーレット Ver. 1.18.1</h1>
        <button onclick="toggleSettings()" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:1.4rem;">⚙️</button>
    </div>

    <!-- タブ切り替えボタン -->
    <div class="tab-container">
        <button class="tab-btn active" id="tab-roulette-btn" onclick="switchTab('roulette')">🎯 ルーレット</button>
        <button class="tab-btn" id="tab-notepad-btn" onclick="switchTab('notepad')">📝 攻略メモ帳</button>
    </div>

    <!-- 設定パネル（ルーレットタブ用） -->
    <div id="settings-panel">
        <!-- ファイルバックアップ＆復元機能 -->
        <div class="preset-container" style="border-color: #2ecc71;">
            <div class="search-label" style="margin-bottom:8px; color:#2ecc71;">📦 外部保存・復元 (閲覧履歴消去対策)</div>
            <div style="display:flex; gap:8px;">
                <button class="bulk-btn" style="background:#2ecc71; flex:1;" onclick="exportData()">💾 設定をファイルに保存</button>
                <button class="bulk-btn" style="background:#3498db; flex:1;" onclick="document.getElementById('import-file-input').click()">📁 ファイルから復元</button>
                <input type="file" id="import-file-input" accept=".json" style="display:none;" onchange="importData(event)">
            </div>
            <div style="font-size:0.7rem; color:#aaa; margin-top:6px;">※Chromeの履歴を消去する前に「保存」しておくと、消去後も「復元」で元の状態に戻せます。</div>
        </div>

        <!-- プリセット管理エリア -->
        <div class="preset-container">
            <div class="search-label" style="margin-bottom:8px; color:var(--accent-color);">💾 ルーレット構成プリセット (最大5つ)</div>
            <div id="presets-list-area"></div>
        </div>

        <div class="search-container">
            <div class="search-label">① EXレベル選択 (一括操作の対象)</div>
            <div class="index-grid ex-grid" id="ex-index"></div>
            
            <div class="search-label">② 頭文字検索 (絞り込み)</div>
            <div class="index-grid kana-grid" id="kana-index"></div>

            <div style="display:flex; gap:5px;">
                <input type="text" id="free-search" style="background:#1a1a1a; border:1px solid #555; color:#fff; padding:8px; border-radius:4px; flex-grow:1; font-size:0.8rem;" placeholder="名前で検索..." oninput="renderSettings()">
                <button onclick="resetSearch()" style="background:#555; border:none; color:white; padding:0 10px; border-radius:4px; cursor:pointer; font-size:0.75rem;">解除</button>
            </div>
        </div>

        <div class="bulk-actions">
            <div style="width:100%; font-size:0.7rem; color:#888; margin-bottom:5px;">一括操作:</div>
            <button onclick="bulkEx(true)" class="bulk-btn" style="background:#3498db;" id="btn-ex-on">全EXを全て有効</button>
            <button onclick="bulkEx(false)" class="bulk-btn" style="background:#e67e22;" id="btn-ex-off">全EXを全て無効</button>
            <button onclick="selectAll(true)" class="bulk-btn" style="background:#2ecc71;">表示中を全て有効</button>
            <button onclick="selectAll(false)" class="bulk-btn" style="background:#e74c3c;">表示中を全て無効</button>
            <button onclick="addNewItem()" class="bulk-btn" style="background:#444;">＋新規追加</button>
        </div>
        
        <!-- モンスター編集＆並び順変更＆現在の討伐数編集 -->
        <div id="edit-list-container" class="item-scroll"></div>

        <!-- 目標討伐数設定エリア -->
        <div class="preset-container" style="margin-top:15px;">
            <div class="search-label" style="margin-bottom:8px; color:#3498db;">🎯 モンスターごとの目標討伐数設定</div>
            
            <!-- 一括設定用コントローラー -->
            <div style="display:flex; align-items:center; gap:8px; background:#1a1a1a; padding:8px; border-radius:5px; margin-bottom:10px; border:1px solid #444;">
                <span style="font-size:0.8rem; color:#ccc;">全モンスター一律:</span>
                <input type="number" id="bulk-target-input" class="number-input" min="0" value="5" style="width:60px;">
                <button class="bulk-btn" style="background:#3498db;" onclick="setBulkTarget()">一括適用</button>
                <button class="bulk-btn" style="background:#e74c3c;" onclick="clearBulkTarget()">目標クリア (全0)</button>
            </div>

            <div id="targets-edit-container" class="item-scroll" style="max-height: 180px;"></div>
        </div>

        <button class="main-btn" style="height:40px; font-size:0.9rem;" onclick="toggleSettings()">保存して戻る</button>
    </div>

    <!-- タブ1: ルーレットコンテンツ -->
    <div id="tab-roulette" class="tab-content active">
        <div class="main-content">
            <div class="left-panel">
                <div style="background:#1e1e1e; border:1px solid #444; border-radius:10px; padding:20px 10px; min-height:220px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:8px;">
                    <div id="res-ex" style="background:#444; color:#fff; font-size:0.7rem; padding:2px 8px; border-radius:4px; visibility:hidden;">EX-</div>
                    <div id="res-name" style="font-size:1.8rem; font-weight:bold; color:#fff;">ターゲット</div>
                    
                    <!-- 当選モンスターの目標進捗表示エリア -->
                    <div id="res-count" style="font-size:1.1rem; font-weight:bold; color:#2ecc71; visibility:hidden;">討伐数: 0体</div>
                    
                    <div id="res-elem" style="font-size:0.85rem; color:var(--accent-color); border:1px solid var(--accent-color); padding:3px 12px; border-radius:20px; visibility:hidden;">-</div>
                    
                    <div class="last-res-area" id="last-res-box" style="visibility:hidden;">
                        前回：<span id="last-name">なし</span> <span id="last-elem" style="font-size:0.75rem;">(-)</span>
                    </div>
                </div>
                
                <div class="stats-info">
                    合計討伐回数: <span id="total-count" class="stats-highlight">0</span> 回<br>
                    有効: <span id="active-count" class="stats-highlight">0</span> / <span id="total-monsters">0</span>
                </div>
                
                <button class="kill-btn" id="kill-action-btn" onclick="addKillCount()" disabled>⚔️ 討伐完了 (+1)</button>
                <button class="main-btn" onclick="draw()">ルーレットを回す</button>
            </div>
            
            <div class="right-panel">
                <div style="background:#252525; padding:15px; border-radius:10px; border:1px solid #444; height:100%;">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--accent-color); padding-bottom:5px; font-size:0.85rem;">
                        <b>討伐記録 & 目標進捗</b>
                        <button style="font-size:0.65rem; background:#444; color:#ccc; border:none; padding:2px 5px; cursor:pointer;" onclick="resetStatsOnly()">リセット</button>
                    </div>
                    <ul id="history-list" style="overflow-y:auto; list-style:none; padding:0; margin:10px 0 0 0; max-height:400px; text-align:left;"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- タブ2: メモ帳コンテンツ -->
    <div id="tab-notepad" class="tab-content">
        <div class="notepad-area">
            <div class="notepad-toolbar">
                <button class="tool-btn" onclick="insertUnderline('divider')">➖ 区切り線 (---)</button>
                <button class="tool-btn" onclick="insertUnderline('border')">＿＿ 下線枠 (＿＿)</button>
            </div>
            <textarea id="notepad-core" class="notepad-textarea" placeholder="ここに装備構成、討伐のコツ、周回メモ、目標タスクなどをがっつり書き込めます..." oninput="saveNote()"></textarea>
            <div class="notepad-footer">
                <span id="note-char-count">0 文字</span>
                <button style="font-size:0.7rem; background:#444; color:#ccc; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="clearNote()">全消去</button>
            </div>
        </div>
    </div>
</div>

<script>
const elementsList = ["火", "水", "雷", "氷", "龍", "毒", "麻痺", "睡眠", "爆破", "なし"];
const kanaGroups = [
    {label:"ア", res:/^[ア-オ]/}, {label:"カ", res:/^[カ-コガ-ゴ]/}, {label:"サ", res:/^[サ-ソザ-ゾ]/}, 
    {label:"タ", res:/^[タ-トダ-ド]/}, {label:"ナ", res:/^[ナ-ノ]/}, {label:"ハ", res:/^[ハ-ホバ-ボパ-ポ]/}, 
    {label:"マ", res:/^[マ-モ]/}, {label:"ヤ", res:/^[ヤ-ヨ]/}, {label:"ラ", res:/^[ラ-ロ]/}, {label:"ワ", res:/^[ワ]/}
];
const defaultData = [
    {ex:"1", name:"オサイズチ", elems:["雷"], enabled:true}, {ex:"1", name:"ドスバギィ", elems:["火"], enabled:true}, {ex:"1", name:"クルルヤック", elems:["水"], enabled:true}, {ex:"1", name:"ドスフロギィ", elems:["氷"], enabled:true}, {ex:"1", name:"アオアシラ", elems:["火"], enabled:true}, {ex:"1", name:"ウルクスス", elems:["火"], enabled:true}, {ex:"1", name:"ラングロトラ", elems:["水"], enabled:true}, {ex:"2", name:"アケノシルム", elems:["水"], enabled:true}, {ex:"2", name:"ロアルドロス", elems:["火"], enabled:true}, {ex:"2", name:"ボルボロス", elems:["火"], enabled:true}, {ex:"2", name:"ダイミョウザザミ", elems:["雷"], enabled:true}, {ex:"2", name:"フルフル", elems:["火"], enabled:true}, {ex:"2", name:"ヨツミワドウ", elems:["雷"], enabled:true}, {ex:"2", name:"ビシュテンゴ", elems:["氷"], enabled:true}, {ex:"3", name:"ビシュテンゴ亜種", elems:["水"], enabled:true}, {ex:"3", name:"プケプケ", elems:["雷"], enabled:true}, {ex:"3", name:"ジュラトドス", elems:["爆破"], enabled:true}, {ex:"2", name:"バサルモス", elems:["龍"], enabled:true}, {ex:"3", name:"イソネミクニ", elems:["雷"], enabled:true}, {ex:"4", name:"イソネミクニ亜種", elems:["火"], enabled:true}, {ex:"3", name:"リオレイア", elems:["龍"], enabled:true}, {ex:"7", name:"リオレイア希少種", elems:["雷"], enabled:true}, {ex:"4", name:"ベリオロス", elems:["火"], enabled:true}, {ex:"3", name:"トビカガチ", elems:["水"], enabled:true}, {ex:"4", name:"マガイマガド", elems:["水"], enabled:true}, {ex:"7", name:"マガイマガド(怨嗟)", elems:["水"], enabled:true}, {ex:"3", name:"アンジャナフ", elems:["水"], enabled:true}, {ex:"4", name:"ナルガクルガ", elems:["雷"], enabled:true}, {ex:"5", name:"タマミツネ", elems:["雷"], enabled:true}, {ex:"4", name:"ゴシャハギ", elems:["火"], enabled:true}, {ex:"4", name:"ガランゴルム", elems:["雷"], enabled:true}, {ex:"3", name:"ショウグンギザミ", elems:["雷"], enabled:true}, {ex:"5", name:"リオレウス", elems:["龍"], enabled:true}, {ex:"7", name:"リオレウス希少種", elems:["水"], enabled:true}, {ex:"4", name:"オロミドロ", elems:["火"], enabled:true}, {ex:"5", name:"オロミドロ亜種", elems:["水"], enabled:true}, {ex:"5", name:"ジンオウガ", elems:["氷"], enabled:true}, {ex:"5", name:"ルナガロン", elems:["火"], enabled:true}, {ex:"5", name:"ライゼクス", elems:["爆破"], enabled:true}, {ex:"6", name:"エスピナス", elems:["氷"], enabled:true}, {ex:"7", name:"エスピナス亜種", elems:["水"], enabled:true}, {ex:"6", name:"ゴア・マガラ", elems:["火"], enabled:true}, {ex:"8", name:"ゴア・マガラ(混沌)", elems:["龍"], enabled:true}, {ex:"5", name:"セルレギオス", elems:["雷"], enabled:true}, {ex:"5", name:"ティガレックス", elems:["雷"], enabled:true}, {ex:"5", name:"ディアブロス", elems:["氷"], enabled:true}, {ex:"4", name:"ヤツカダキ", elems:["氷"], enabled:true}, {ex:"6", name:"ヤツカダキ亜種", elems:["水"], enabled:true}, {ex:"8", name:"クシャルダオラ", elems:["雷"], enabled:true}, {ex:"8", name:"オオナズチ", elems:["火"], enabled:true}, {ex:"8", name:"テオ・テスカトル", elems:["水"], enabled:true}, {ex:"9", name:"シャガルマガラ", elems:["龍"], enabled:true}, {ex:"6", name:"ラージャン", elems:["氷"], enabled:true}, {ex:"7", name:"ラージャン(激昂)", elems:["氷"], enabled:true}, {ex:"6", name:"バゼルギウス", elems:["雷"], enabled:true}, {ex:"7", name:"バゼルギウス(紅蓮)", elems:["氷"], enabled:true}, {ex:"9", name:"バルファルク", elems:["爆破"], enabled:true}
];

let state = {
    monsters: JSON.parse(localStorage.getItem('MHR_V15_DATA')) || defaultData,
    stats: JSON.parse(localStorage.getItem('MHR_V15_STATS')) || {},
    targets: JSON.parse(localStorage.getItem('MHR_V18_TARGETS')) || {},
    note: localStorage.getItem('MHR_V16_NOTE') || "",
    presets: JSON.parse(localStorage.getItem('MHR_V17_PRESETS')) || [null, null, null, null, null],
    curIdx: null,
    lastIdx: null, 
    searchLevel: null,
    searchKana: null
};

let draggedItemIndex = null;

function save() {
    localStorage.setItem('MHR_V15_DATA', JSON.stringify(state.monsters));
    localStorage.setItem('MHR_V15_STATS', JSON.stringify(state.stats));
    localStorage.setItem('MHR_V18_TARGETS', JSON.stringify(state.targets));
    localStorage.setItem('MHR_V17_PRESETS', JSON.stringify(state.presets));
}

function exportData() {
    const backupObj = {
        monsters: state.monsters,
        stats: state.stats,
        targets: state.targets,
        note: state.note,
        presets: state.presets,
        version: "1.18.1"
    };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `mhr_roulette_backup_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.monsters) throw new Error("無効なファイルフォーマットです");

            if (confirm("バックアップファイルからデータを復元しますか？\n（現在の設定・記録・メモ帳は上書きされます）")) {
                state.monsters = data.monsters || defaultData;
                state.stats = data.stats || {};
                state.targets = data.targets || {};
                state.note = data.note || "";
                state.presets = data.presets || [null, null, null, null, null];
                state.curIdx = null;
                state.lastIdx = null;

                save();
                localStorage.setItem('MHR_V16_NOTE', state.note);

                renderSettings();
                renderPresets();
                refresh();
                alert("設定の復元が完了しました！");
            }
        } catch (err) {
            alert("ファイルの読み込みに失敗しました。正しいバックアップファイルを選択してください。");
        }
    };
    reader.readAsText(file);
    event.target.value = "";
}

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    document.getElementById(`tab-${tab}-btn`).classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');

    if(tab === 'notepad') {
        const tx = document.getElementById('notepad-core');
        tx.value = state.note;
        updateCharCount();
    }
}

function saveNote() {
    const val = document.getElementById('notepad-core').value;
    state.note = val;
    localStorage.setItem('MHR_V16_NOTE', val);
    updateCharCount();
}
function updateCharCount() {
    document.getElementById('note-char-count').innerText = `${state.note.length} 文字`;
}
function clearNote() {
    if(confirm("メモの内容をすべて消去しますか？")) {
        state.note = "";
        document.getElementById('notepad-core').value = "";
        localStorage.setItem('MHR_V16_NOTE', "");
        updateCharCount();
    }
}

function insertUnderline(type) {
    const tx = document.getElementById('notepad-core');
    const start = tx.selectionStart;
    const end = tx.selectionEnd;
    const currentText = tx.value;
    
    let insertStr = "";
    if (type === 'divider') {
        insertStr = "\n----------------------------\n";
    } else if (type === 'border') {
        insertStr = "＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿";
    }

    tx.value = currentText.substring(0, start) + insertStr + currentText.substring(end);
    tx.focus();
    tx.selectionStart = tx.selectionEnd = start + insertStr.length;
    saveNote();
}

function renderPresets() {
    const area = document.getElementById('presets-list-area');
    area.innerHTML = "";
    
    state.presets.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'preset-row';
        
        if (p) {
            row.innerHTML = `
                <div class="preset-name">スロット${i+1}: ${p.name} <small style="color:#888; font-weight:normal;">(${p.data.filter(m=>m.enabled).length}体有効)</small></div>
                <div style="display:flex; gap:3px;">
                    <button class="preset-action-btn" style="background:#2ecc71;" onclick="loadPreset(${i})">読込</button>
                    <button class="preset-action-btn" style="background:#e67e22;" onclick="savePreset(${i}, true)">上書</button>
                    <button class="preset-action-btn" style="background:#e74c3c; padding:4px 6px;" onclick="deletePreset(${i})">❌</button>
                </div>
            `;
        } else {
            row.innerHTML = `
                <div class="preset-name preset-empty">スロット${i+1}: 未登録</div>
                <button class="preset-action-btn" style="background:#3498db;" onclick="savePreset(${i}, false)">現在の設定を保存</button>
            `;
        }
        area.appendChild(row);
    });
}

function savePreset(slotIdx, isOverwrite) {
    let pName = "マイセット";
    if (isOverwrite) {
        if (!confirm(`スロット${slotIdx+1} のプリセットを現在の設定で上書きしますか？`)) return;
        pName = state.presets[slotIdx].name;
    } else {
        const input = prompt(`プリセット${slotIdx+1} の名前を入力してください:`, `構成セット ${slotIdx+1}`);
        if (input === null) return;
        if (input.trim() !== "") pName = input.trim();
    }
    
    state.presets[slotIdx] = {
        name: pName,
        data: JSON.parse(JSON.stringify(state.monsters))
    };
    
    save();
    renderPresets();
}

function loadPreset(slotIdx) {
    const p = state.presets[slotIdx];
    if (!p) return;
    
    if (confirm(`プリセット「${p.name}」を読み込みますか？\n(現在のルーレット設定は上書きされます)`)) {
        state.monsters = JSON.parse(JSON.stringify(p.data));
        state.curIdx = null;
        state.lastIdx = null;
        
        save();
        renderSettings();
        renderPresets();
        refresh();
        alert(`プリセット「${p.name}」を適用しました。`);
    }
}

function deletePreset(slotIdx) {
    if (confirm(`スロット${slotIdx+1} のプリセットを削除しますか？`)) {
        state.presets[slotIdx] = null;
        save();
        renderPresets();
    }
}

function renderIndices() {
    const exBox = document.getElementById('ex-index');
    exBox.innerHTML = "";
    for(let i=1; i<=9; i++) {
        const btn = document.createElement('button');
        btn.className = 'index-btn' + (state.searchLevel == i ? ' active' : '');
        btn.innerText = 'EX' + i;
        btn.onclick = () => { state.searchLevel = (state.searchLevel == i) ? null : i; updateBulkLabel(); renderIndices(); renderSettings(); };
        exBox.appendChild(btn);
    }
    const kanaBox = document.getElementById('kana-index');
    kanaBox.innerHTML = "";
    kanaGroups.forEach(g => {
        const btn = document.createElement('button');
        btn.className = 'index-btn' + (state.searchKana == g.label ? ' active' : '');
        btn.innerText = g.label + '行';
        btn.onclick = () => { state.searchKana = (state.searchKana == g.label) ? null : g.label; renderIndices(); renderSettings(); };
        kanaBox.appendChild(btn);
    });
    updateBulkLabel();
}

function updateBulkLabel() {
    const onBtn = document.getElementById('btn-ex-on');
    const offBtn = document.getElementById('btn-ex-off');
    const label = state.searchLevel ? `EX${state.searchLevel}` : "全EX";
    onBtn.innerText = `${label}を全て有効`;
    offBtn.innerText = `${label}を全て無効`;
}

function bulkEx(v) {
    state.monsters.forEach(m => {
        if(!state.searchLevel || m.ex == state.searchLevel) m.enabled = v;
    });
    save(); renderSettings(); renderPresets(); refresh();
}

function resetSearch() {
    state.searchLevel = null; state.searchKana = null;
    document.getElementById('free-search').value = "";
    renderIndices(); renderSettings();
}

function getFiltered() {
    const free = document.getElementById('free-search').value.toLowerCase();
    const kanaRegex = state.searchKana ? kanaGroups.find(g => g.label === state.searchKana).res : null;
    let list = state.monsters.map((m, i) => ({...m, oid: i})).filter(m => {
        if(state.searchLevel && m.ex != state.searchLevel) return false;
        if(kanaRegex && !kanaRegex.test(m.name)) return false;
        if(free && !m.name.toLowerCase().includes(free)) return false;
        return true;
    });
    return list;
}

/* 並び順変更関数（上下移動） */
function moveItem(originalIndex, direction) {
    const targetIndex = originalIndex + direction;
    if (targetIndex < 0 || targetIndex >= state.monsters.length) return;

    // 配列の要素を入れ替え
    const temp = state.monsters[originalIndex];
    state.monsters[originalIndex] = state.monsters[targetIndex];
    state.monsters[targetIndex] = temp;

    // 統計データ（討伐数・目標数）もキーを付け替え
    const swapData = (obj) => {
        const v1 = obj[originalIndex];
        const v2 = obj[targetIndex];
        if (v2 !== undefined) obj[originalIndex] = v2; else delete obj[originalIndex];
        if (v1 !== undefined) obj[targetIndex] = v1; else delete obj[targetIndex];
    };
    swapData(state.stats);
    swapData(state.targets);

    // 当選中のインデックス追跡を補正
    if (state.curIdx === originalIndex) state.curIdx = targetIndex;
    else if (state.curIdx === targetIndex) state.curIdx = originalIndex;
    
    if (state.lastIdx === originalIndex) state.lastIdx = targetIndex;
    else if (state.lastIdx === targetIndex) state.lastIdx = originalIndex;

    save();
    renderSettings();
    refresh();
}

function toggleElementSelection(monsterIndex, targetElem) {
    let currentElems = state.monsters[monsterIndex].elems || [];
    
    if (targetElem === "なし") {
        state.monsters[monsterIndex].elems = ["なし"];
        save(); renderSettings(); refresh();
        return;
    }

    currentElems = currentElems.filter(e => e !== "なし");

    if (currentElems.includes(targetElem)) {
        currentElems = currentElems.filter(e => e !== targetElem);
        if (currentElems.length === 0) currentElems = ["なし"];
    } else {
        if (currentElems.length >= 2) {
            currentElems.shift();
        }
        currentElems.push(targetElem);
    }

    state.monsters[monsterIndex].elems = currentElems;
    save(); renderSettings(); refresh();
}

function renderSettings() {
    const container = document.getElementById('edit-list-container');
    container.innerHTML = "";
    
    const isFiltered = !!(state.searchLevel || state.searchKana || document.getElementById('free-search').value.trim());

    getFiltered().forEach((m, idx, arr) => {
        const statVal = state.stats[m.oid] || 0;
        const div = document.createElement('div');
        div.className = 'edit-row' + (m.enabled ? '' : ' disabled');
        div.draggable = !isFiltered; // 絞り込み中でないときだけドラッグ移動可
        div.dataset.index = m.oid;

        div.innerHTML = `
            <div style="display:flex; align-items:center; gap:6px;">
                <span class="drag-handle" title="${isFiltered ? '検索解除でドラッグ移動可能' : 'ドラッグで移動'}">☰</span>
                <div style="display:flex; flex-direction:column; gap:2px;">
                    <button class="move-btn" onclick="moveItem(${m.oid}, -1)" ${m.oid === 0 || isFiltered ? 'disabled' : ''}>▲</button>
                    <button class="move-btn" onclick="moveItem(${m.oid}, 1)" ${m.oid === state.monsters.length - 1 || isFiltered ? 'disabled' : ''}>▼</button>
                </div>
                <input type="checkbox" ${m.enabled?'checked':''} onchange="toggleEnable(${m.oid}, this.checked)">
                <span style="font-size:0.7rem; color:#888; width:28px;">EX${m.ex}</span>
                <input type="text" class="input-text" value="${m.name}" oninput="state.monsters[${m.oid}].name=this.value; save(); refresh();">
                <span style="font-size:0.75rem; color:#aaa; margin-left:3px;">討伐:</span>
                <input type="number" class="number-input" min="0" value="${statVal}" oninput="updateStatValue(${m.oid}, this.value)">
                <button class="delete-btn" onclick="deleteItem(${m.oid}, '${m.name}')" title="削除">❌</button>
            </div>
            <div style="display:flex; gap:3px; margin-top:5px; margin-left:55px;" id="el-${m.oid}"></div>
        `;

        // ドラッグ＆ドロップ イベントリスナーの設定（絞り込み時は無効）
        if (!isFiltered) {
            div.addEventListener('dragstart', (e) => {
                draggedItemIndex = m.oid;
                e.target.classList.add('dragging');
            });
            div.addEventListener('dragend', (e) => {
                e.target.classList.remove('dragging');
                draggedItemIndex = null;
            });
            div.addEventListener('dragover', (e) => {
                e.preventDefault();
            });
            div.addEventListener('drop', (e) => {
                e.preventDefault();
                const targetIdx = parseInt(div.dataset.index, 10);
                if (draggedItemIndex !== null && draggedItemIndex !== targetIdx) {
                    moveItemToTarget(draggedItemIndex, targetIdx);
                }
            });
        }

        const sel = div.querySelector(`#el-${m.oid}`);
        const currentSelected = m.elems || ["なし"];
        
        elementsList.forEach(e => {
            const btn = document.createElement('button');
            btn.className = 'elem-btn' + (currentSelected.includes(e) ? ' active' : '');
            btn.innerText = e;
            btn.onclick = () => { toggleElementSelection(m.oid, e); };
            sel.appendChild(btn);
        });
        container.appendChild(div);
    });

    renderTargetsEdit();
}

/* ドラッグ＆ドロップ時の移動処理 */
function moveItemToTarget(fromIdx, toIdx) {
    const movedItem = state.monsters.splice(fromIdx, 1)[0];
    state.monsters.splice(toIdx, 0, movedItem);

    // 統計・目標のデータ並べ替え
    const rebuildObj = (obj) => {
        let newObj = {};
        let items = [];
        for(let i=0; i<state.monsters.length + 1; i++) {
            items.push(obj[i]);
        }
        const moved = items.splice(fromIdx, 1)[0];
        items.splice(toIdx, 0, moved);
        items.forEach((val, i) => {
            if (val !== undefined) newObj[i] = val;
        });
        return newObj;
    };

    state.stats = rebuildObj(state.stats);
    state.targets = rebuildObj(state.targets);

    state.curIdx = null;
    state.lastIdx = null;

    save();
    renderSettings();
    refresh();
}

function renderTargetsEdit() {
    const container = document.getElementById('targets-edit-container');
    container.innerHTML = "";
    
    state.monsters.forEach((m, i) => {
        const targetVal = state.targets[i] || 0;
        const div = document.createElement('div');
        div.className = 'target-edit-row';
        div.innerHTML = `
            <span>${m.name} <small style="color:#888;">[EX${m.ex}]</small></span>
            <div>
                目標: <input type="number" class="number-input" min="0" value="${targetVal}" oninput="updateTargetValue(${i}, this.value)"> 体
            </div>
        `;
        container.appendChild(div);
    });
}

function updateStatValue(index, value) {
    const val = parseInt(value, 10);
    state.stats[index] = (!isNaN(val) && val >= 0) ? val : 0;
    save();
    refresh();
}

function updateTargetValue(index, value) {
    const val = parseInt(value, 10);
    state.targets[index] = (!isNaN(val) && val >= 0) ? val : 0;
    save();
    refresh();
}

function setBulkTarget() {
    const inputVal = parseInt(document.getElementById('bulk-target-input').value, 10);
    const targetVal = (!isNaN(inputVal) && inputVal >= 0) ? inputVal : 0;
    
    if (confirm(`すべてのモンスターの目標討伐数を一律 ${targetVal} 体 に設定しますか？`)) {
        state.monsters.forEach((_, i) => {
            state.targets[i] = targetVal;
        });
        save();
        renderTargetsEdit();
        refresh();
    }
}

function clearBulkTarget() {
    if (confirm("すべてのモンスターの目標討伐数をクリア (0に設定) しますか？")) {
        state.monsters.forEach((_, i) => {
            state.targets[i] = 0;
        });
        save();
        renderTargetsEdit();
        refresh();
    }
}

function toggleEnable(i, v) { state.monsters[i].enabled = v; save(); renderSettings(); refresh(); }
function selectAll(b) { getFiltered().forEach(m => state.monsters[m.oid].enabled = b); save(); renderSettings(); refresh(); }

function addNewItem() { 
    state.monsters.push({
        ex: state.searchLevel ? String(state.searchLevel) : "1", 
        name: "新規モンスター", 
        elems: ["なし"], 
        enabled: true
    }); 
    save(); 
    renderSettings();
    refresh();
}

function deleteItem(index, name) {
    if (confirm(`「${name}」をリストから削除しますか？\n(この操作は取り消せません)`)) {
        state.curIdx = null;
        state.lastIdx = null;
        
        delete state.stats[index];
        delete state.targets[index];
        
        let newStats = {}, newTargets = {};
        Object.keys(state.stats).forEach(k => {
            let ki = parseInt(k);
            if (ki > index) newStats[ki - 1] = state.stats[k];
            else if (ki < index) newStats[ki] = state.stats[k];
        });
        Object.keys(state.targets).forEach(k => {
            let ki = parseInt(k);
            if (ki > index) newTargets[ki - 1] = state.targets[k];
            else if (ki < index) newTargets[ki] = state.targets[k];
        });

        state.stats = newStats;
        state.targets = newTargets;
        state.monsters.splice(index, 1);
        
        save();
        renderSettings();
        refresh();
    }
}

function toggleSettings() {
    const p = document.getElementById('settings-panel');
    if(p.style.display === 'block') { p.style.display = 'none'; refresh(); }
    else { renderIndices(); renderSettings(); renderPresets(); p.style.display = 'block'; }
}

function formatElements(elems) {
    if (!elems || elems.length === 0) return "なし";
    return elems.join(" / ");
}

function refresh() {
    const cur = state.monsters[state.curIdx];
    const killBtn = document.getElementById('kill-action-btn');

    if(cur) {
        document.getElementById('res-name').innerText = cur.name;
        document.getElementById('res-ex').innerText = 'EX' + cur.ex;
        document.getElementById('res-ex').style.visibility = "visible";
        document.getElementById('res-elem').innerText = "おすすめ：" + formatElements(cur.elems);
        document.getElementById('res-elem').style.visibility = "visible";
        
        const currentCount = state.stats[state.curIdx] || 0;
        const currentTarget = state.targets[state.curIdx] || 0;
        
        let countText = "";
        if (currentTarget > 0) {
            const remaining = currentTarget - currentCount;
            if (remaining > 0) {
                countText = `目標まであと ${remaining} 体 (現在 ${currentCount}/${currentTarget})`;
            } else {
                countText = `🎉 目標達成！ (${currentCount}/${currentTarget}体)`;
            }
        } else {
            countText = `討伐数: ${currentCount}体`;
        }
        
        const countElem = document.getElementById('res-count');
        countElem.innerText = countText;
        countElem.style.visibility = "visible";

        killBtn.innerText = `⚔️ ${cur.name} を討伐完了 (+1)`;
        killBtn.disabled = false;
    } else {
        document.getElementById('res-name').innerText = "ターゲット";
        document.getElementById('res-ex').style.visibility = "hidden";
        document.getElementById('res-elem').style.visibility = "hidden";
        document.getElementById('res-count').style.visibility = "hidden";
        
        killBtn.innerText = "⚔️ 討伐完了 (+1)";
        killBtn.disabled = true;
    }

    const last = state.monsters[state.lastIdx];
    if(last && state.curIdx !== state.lastIdx) { 
        document.getElementById('last-res-box').style.visibility = "visible";
        document.getElementById('last-name').innerText = last.name;
        document.getElementById('last-elem').innerText = `(${formatElements(last.elems)})`;
    } else {
        document.getElementById('last-res-box').style.visibility = "hidden";
    }

    const total = Object.values(state.stats).reduce((a, b) => a + b, 0);
    document.getElementById('total-count').innerText = total;
    document.getElementById('active-count').innerText = state.monsters.filter(m => m.enabled).length;
    document.getElementById('total-monsters').innerText = state.monsters.length;
    
    const list = document.getElementById('history-list'); list.innerHTML = "";
    state.monsters.forEach((m, i) => {
        const count = state.stats[i] || 0;
        const target = state.targets[i] || 0;
        const isCurrent = (i === state.curIdx);
        
        if(count > 0 || target > 0 || isCurrent) {
            const li = document.createElement('li'); 
            li.style.cssText = `padding:6px; border-bottom:1px solid #333; font-size:0.8rem; ${isCurrent ? 'background:rgba(255, 71, 87, 0.15); border-left:3px solid var(--accent-color);' : ''}`;
            
            let targetText = target > 0 ? ` / <span style="color:#888;">${target}体</span>` : "";
            let percent = target > 0 ? Math.min(100, Math.floor((count / target) * 100)) : 0;
            
            li.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>${m.name} <small style="color:#666;">[EX${m.ex}]</small> ${isCurrent ? '<small style="color:var(--accent-color); font-weight:bold;">◀ 当選中</small>' : ''}</span>
                    <span><b>${count}</b>${targetText}</span>
                </div>
                ${target > 0 ? `<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${percent}%;"></div></div>` : ''}
            `;
            list.appendChild(li);
        }
    });
}

function draw() {
    const poolAll = state.monsters.map((m, i) => ({...m, idx: i})).filter(m => m.enabled);
    if(poolAll.length === 0) return alert("有効なモンスターを選択してください");

    if(state.curIdx !== null) {
        state.lastIdx = state.curIdx;
    }

    let pool = [...poolAll];
    if(pool.length > 1 && state.lastIdx !== null) {
        pool = pool.filter(m => m.idx !== state.lastIdx);
    }

    const s = pool[Math.floor(Math.random() * pool.length)];
    state.curIdx = s.idx; 
    
    if (state.stats[state.curIdx] === undefined) {
        state.stats[state.curIdx] = 0;
    }

    save(); refresh();
}

function addKillCount() {
    if (state.curIdx !== null) {
        state.stats[state.curIdx] = (state.stats[state.curIdx] || 0) + 1;
        save();
        refresh();
    }
}

function resetStatsOnly() { if(confirm("記録をリセットしますか？")){ state.stats = {}; state.lastIdx = null; state.curIdx = null; save(); refresh(); } }
refresh();
</script>
